# Dependabot configuration: opens weekly pull requests that bump dependencies.
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # GitHub Actions versions used in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Put all action bumps into one PR instead of one PR per action.
    groups:
      github-actions:
        patterns: ["*"]
    # Conventional-commit prefix, so these PRs are easy to filter in the log.
    commit-message:
      prefix: "ci"

  # Go module dependencies listed in go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "go"

  # Base image tags in the Dockerfile (golang and alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
